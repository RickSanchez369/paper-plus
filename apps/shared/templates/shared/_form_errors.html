{% comment %}
Errors that belong to the form rather than to one field — "start date is
after end date", say. Shown above the fields, where they are read first.
{% endcomment %}
{% if form.non_field_errors %}
  <div class="form-error" role="alert">
    {% for error in form.non_field_errors %}<div>{{ error }}</div>{% endfor %}
  </div>
{% endif %}

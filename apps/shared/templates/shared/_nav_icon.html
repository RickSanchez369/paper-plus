{% comment %} Inline SVG rather than an icon font or an <img> per item: they inherit
   currentColor, so the active/hover states need no second asset, and there
   is no extra request. Names come from NavGroup.icon. {% endcomment %}
<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
  {% if name == "home" %}
    <path d="M4 10.5 12 4l8 6.5"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/>
  {% elif name == "sale" %}
    <path d="M4 7h16"/><path d="M6 7v12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/><path d="M9.5 12.5h5"/>
  {% elif name == "purchase" %}
    <path d="M3 5h2l2.2 10.2a1.5 1.5 0 0 0 1.5 1.2h7.9a1.5 1.5 0 0 0 1.5-1.2L20 8H6"/><circle cx="9.5" cy="19.5" r="1.2"/><circle cx="16.5" cy="19.5" r="1.2"/>
  {% elif name == "inventory" %}
    <path d="M4 8.5 12 4.5l8 4v7l-8 4-8-4z"/><path d="M4 8.5 12 12.5l8-4"/><path d="M12 12.5v7"/>
  {% elif name == "ledger" %}
    <path d="M6 4h9l4 4v12H6z"/><path d="M15 4v4h4"/><path d="M9.5 13h6"/><path d="M9.5 16.5h4"/>
  {% elif name == "bank" %}
    <path d="M3.5 9.5 12 5l8.5 4.5"/><path d="M5.5 10.5v7"/><path d="M10 10.5v7"/><path d="M14 10.5v7"/><path d="M18.5 10.5v7"/><path d="M3.5 19.5h17"/>
  {% elif name == "expense" %}
    <circle cx="12" cy="12" r="8"/><path d="M12 7.5v9"/><path d="M14.5 10a2.5 2.5 0 0 0-5 .3c0 2.2 5 1.3 5 3.5a2.5 2.5 0 0 1-5 .2"/>
  {% elif name == "return" %}
    <path d="M9 7 5 11l4 4"/><path d="M5 11h9a5 5 0 0 1 0 10h-3"/>
  {% elif name == "customer" %}
    <circle cx="12" cy="9" r="3.2"/><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0"/>
  {% elif name == "report" %}
    <path d="M4.5 19.5h15"/><path d="M7.5 19.5V12"/><path d="M12 19.5V7"/><path d="M16.5 19.5v-5"/>
  {% elif name == "backup" %}
    <path d="M12 4v10"/><path d="m8 10.5 4 4 4-4"/><path d="M5 15.5V19h14v-3.5"/>
  {% elif name == "activity" %}
    <path d="M4 12.5h3.5L10 7l4 10 2.2-4.5H20"/>
  {% endif %}
</svg>

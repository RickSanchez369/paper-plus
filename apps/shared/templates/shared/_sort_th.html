<th{% if active %} aria-sort="{% if direction == 'desc' %}descending{% else %}ascending{% endif %}"{% endif %}>
  <a class="sort-link{% if active %} sort-link--active{% endif %}" href="?{{ query }}sort={{ key }}&amp;dir={{ next_dir }}" title="مرتب‌سازی بر اساس {{ label }}">{{ label }}<span class="sort-icon" aria-hidden="true"></span></a>
</th>
